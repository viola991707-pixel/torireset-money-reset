}

}

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding-bottom:84px}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:1.15rem;font-weight:650}

p{margin:.35rem 0}
a{color:var(--accent)}

header.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
header.top .brand{flex:1;min-width:0}
header.top .brand small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main.wrap{padding-top:18px}
h1,h2,.big,.hero .label{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif}
header.top .logo{width:34px;height:34px;flex:none}
.hero{background:linear-gradient(145deg,var(--accent-soft) 0%,var(--card) 62%);padding:20px 18px 14px}
.hero.amber{background:var(--amber-soft)}
.hero .big{font-size:3.4rem;margin:.35rem 0 .1rem}
.cents{font-size:.45em;font-weight:650;letter-spacing:0;opacity:.7;vertical-align:.55em;margin-left:1px}
.herosub{margin:.25rem 0 .5rem;color:var(--muted)}
.card.focus{border-left:5px solid var(--accent);padding-left:14px}
.card.focus h2{font-size:1.2rem;margin:.3rem 0 .2rem}
