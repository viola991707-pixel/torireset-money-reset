<title>Money Reset by ToriReset</title>
<style>
:root{
  --bg:#F7F2EA; --card:#FFFDF9; --ink:#2B2623; --muted:#6F655C; --line:#E8DFD2;
  --accent:#A8461F; --accent-ink:#FFFFFF; --accent-soft:#F6E3D8;
  --sage:#3E6B3E; --sage-soft:#E4EEE0; --amber:#8A5A00; --amber-soft:#FBEBC8;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1816; --card:#26211E; --ink:#F1EBE3; --muted:#B0A599; --line:#3A332E;
    --accent:#E58A63; --accent-ink:#1B1816; --accent-soft:#3B2A22;
    --sage:#9CC39B; --sage-soft:#26332A; --amber:#F0BE5A; --amber-soft:#3A2F14;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1816; --card:#26211E; --ink:#F1EBE3; --muted:#B0A599; --line:#3A332E;
  --accent:#E58A63; --accent-ink:#1B1816; --accent-soft:#3B2A22;
  --sage:#9CC39B; --sage-soft:#26332A; --amber:#F0BE5A; --amber-soft:#3A2F14;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding-bottom:84px}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:1.15rem;font-weight:650}
h2{font-size:1.05rem;font-weight:650;margin-bottom:.5rem}
h3{font-size:.95rem;font-weight:650}
p{margin:.35rem 0}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
header.top .brand{flex:1;min-width:0}
header.top .brand small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main.wrap{padding-top:18px}
h1,h2,.big,.hero .label{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif}
header.top .logo{width:34px;height:34px;flex:none}
.hero{background:linear-gradient(145deg,var(--accent-soft) 0%,var(--card) 62%);padding:20px 18px 14px}
.hero.amber{background:var(--amber-soft)}
.hero .big{font-size:3.4rem;margin:.35rem 0 .1rem}
.cents{font-size:.45em;font-weight:650;letter-spacing:0;opacity:.7;vertical-align:.55em;margin-left:1px}
.herosub{margin:.25rem 0 .5rem;color:var(--muted)}
.card.focus{border-left:5px solid var(--accent);padding-left:14px}
.card.focus h2{font-size:1.2rem;margin:.3rem 0 .2rem}
.billrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.billrow:first-child{border-top:0}
button.check{width:44px;height:44px;min-height:44px;padding:0;border:0;background:none;flex:none;border-radius:50%}
button.check i{width:26px;height:26px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.9rem;font-weight:700;color:var(--card)}
button.check:hover i{border-color:var(--sage)}
button.check.on i{background:var(--sage);border-color:var(--sage)}
.billrow.done .nm{text-decoration:line-through;color:var(--muted)}
button.linkbtn{min-height:36px;padding:0 6px;border:0;background:none;color:var(--muted);font-size:inherit;text-decoration:underline;border-radius:6px}
button.linkbtn:hover{color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button.rowedit{display:block;min-height:40px;padding:2px 0;border:0;background:none;text-align:left;font:inherit;color:inherit;border-radius:8px;line-height:1.35}
button.rowedit:hover{color:var(--accent)}
.stmtsum{row-gap:12px;margin:6px 0 4px;padding:12px;border-radius:12px;background:var(--bg)}
.pos{color:var(--sage)}
.list>li.dayhead{padding:14px 0 2px;border-top:0}
.stmtlist>li.dayhead:first-child{padding-top:4px}
button.x{width:40px;min-height:40px;padding:0;border:0;background:none;color:var(--muted);font:400 1.5rem/1 system-ui,sans-serif;flex:none}
button.x:hover{color:var(--amber)}
.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 14px}
@media (min-width:640px){.sheet::before{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card.soft{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.card.sage{background:var(--sage-soft);border-color:transparent;box-shadow:none}
.card.amber{background:var(--amber-soft);border-color:transparent;box-shadow:none}
.muted{color:var(--muted)} .small{font-size:.85rem} .center{text-align:center}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.big{font-size:3rem;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:.1rem 0 .2rem}
.num{font-variant-numeric:tabular-nums}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;background:var(--line);color:var(--ink)}
.pill.ok{background:var(--sage-soft);color:var(--sage)} .pill.warn{background:var(--amber-soft);color:var(--amber)}
button,.btn{font:inherit;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 10px}
button.tiny{min-height:40px;padding:0 12px;font-size:.9rem}
button.danger{color:var(--amber)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;min-height:46px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:120px}
label{display:block;font-size:.88rem;font-weight:600;margin:12px 0 4px}
label.check{display:flex;gap:10px;align-items:center;font-weight:500;margin:12px 0}
label.check input{width:22px;min-height:22px;height:22px}
.hint{font-size:.82rem;color:var(--muted);margin:3px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;font-size:.92rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--sage);border-radius:99px}
.bar.over>i{background:var(--amber)}
details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"\25BE";margin-left:auto;color:var(--muted)}
details[open]>summary::after{content:"\25B4"}
.how{margin-top:6px;font-size:.92rem}
.how table{width:100%;border-collapse:collapse}
.how td{padding:5px 0;border-top:1px solid var(--line)} .how td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.how tr.total td{font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 8px}
nav.tabs button{flex-direction:column;gap:2px;border:0;background:transparent;min-height:56px;padding:4px 0;font-size:.75rem;color:var(--muted);border-radius:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;display:flex;gap:12px;align-items:center;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast button{min-height:34px;padding:0 12px;border-color:transparent;background:rgba(255,255,255,.18);color:inherit}
.overlay{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:30;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:calc(var(--vvh,100vh) - 16px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:22px 22px 0 0;padding:20px 18px 24px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px}}
.err{color:var(--amber);font-weight:600;margin-top:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:.72rem;color:var(--muted);text-align:center;padding:4px 0}
.cal button{min-height:52px;padding:2px;flex-direction:column;gap:2px;border-radius:10px;font-size:.9rem;align-items:center;justify-content:flex-start}
.cal button.empty{visibility:hidden}
.cal button.today{border-color:var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.dots{display:flex;gap:3px;min-height:8px}
.dot{width:7px;height:7px;border-radius:50%;border:2px solid var(--accent);background:transparent}
.dot.paid{background:var(--accent)} .dot.pay{border-color:var(--sage);background:var(--sage)} .dot.sp{border-color:var(--muted);background:var(--muted);width:5px;height:5px;margin-top:1px}
.banner{border-radius:14px;padding:12px 14px;margin:0 0 14px;background:var(--amber-soft);color:var(--ink)}
.tag{font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card,.toast{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media print{nav.tabs,header.top,.toast{display:none}}
#themeBtn{width:40px;padding:0}
input[type=file]{padding:7px 10px;min-height:48px}
input[type=file]::file-selector-button{font:inherit;min-height:34px;padding:0 14px;margin-right:12px;border-radius:10px;border:1px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer}
.dot.pay{background:transparent}.dot.pay.got{background:var(--sage)}.dot.pay.wait{border-style:dotted}.dot.pay.skipd{opacity:.45;background:transparent}
.sharebar{height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}.sharebar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.search{margin-top:10px}

/* touch screens: the sheet sits at the top, so the on-screen keyboard (even a split or floating one on an iPad) does not cover it; the buttons stay reachable at its bottom edge */
@media (pointer:coarse){.overlay{align-items:flex-start;padding:max(8px,env(safe-area-inset-top)) 8px 8px;box-sizing:border-box}.sheet{border-radius:22px;max-height:calc(var(--vvh,100vh) - 24px)}.sheet::before{display:none}}
.sheetactions{position:sticky;bottom:-24px;margin:16px -18px -24px;padding:12px 18px 24px;background:var(--card);border-top:1px solid var(--line);justify-content:flex-end}

</style>
</head>

  <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" style="fill:var(--accent-soft)"/><path d="M17 26c-5.5 0-8.5-4-8.5-8.5 5.5 0 8.5 2.2 8.5 8.5Zm0 0c0-5.6 3-8.6 8.5-8.6 0 4.7-3.2 8.6-8.5 8.6Z" style="fill:var(--accent)"/><path d="M17 26v-9" style="stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;fill:none"/></svg>
  <div class="brand"><h1 id="appTitle">Money Reset</h1><small id="appSub"></small></div>
  <button class="tiny" id="themeBtn" aria-label="Change color theme" title="Change color theme">&#9680;</button>

<main class="wrap" id="app"><noscript>Money Reset needs JavaScript. Please open this file in Chrome, Safari, Edge or Firefox.</noscript></main>
<nav class="tabs" aria-label="Main"><div class="wrap" id="tabs">
  <button data-act="nav" data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-act="nav" data-view="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Bills</button>
  <button data-act="nav" data-view="income"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v14M6 11l6 6 6-6M5 21h14"/></svg>Money in</button>
  <button data-act="nav" data-view="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v12H3zM3 11h18M7 15h3"/></svg>Spending</button>
  <button data-act="nav" data-view="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</div></nav>
<div id="toastRoot"></div>
<div id="modalRoot"></div>
<script>
/* ToriReset Money Reset — core logic (no DOM). Dates are local 'YYYY-MM-DD' strings. */
(function (root) {
  'use strict';

  /* ---------- dates ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);
  const parse = (s) => { const a = s.split('-').map(Number); return { y: a[0], m: a[1], d: a[2] }; };
  const dayNum = (s) => { const p = parse(s); return Math.round(Date.UTC(p.y, p.m - 1, p.d) / 86400000); };
  const fromDayNum = (n) => { const dt = new Date(n * 86400000); return iso(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate()); };
  const addDays = (s, n) => fromDayNum(dayNum(s) + n);
  const daysBetween = (a, b) => dayNum(b) - dayNum(a);
  const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const dow = (s) => new Date(dayNum(s) * 86400000).getUTCDay();
  const todayISO = () => { const d = new Date(); return iso(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
  const addMonths = (y, m, n) => { const t = y * 12 + (m - 1) + n; return { y: Math.floor(t / 12), m: (t % 12) + 1 }; };
  const monthKey = (s) => s.slice(0, 7);
  const dayOfMonth = (s) => parse(s).d;
  const round2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

  /* ---------- schedules ---------- */
  // item: {freq:'monthly'|'twice'|'biweekly'|'weekly'|'months'|'once', day, day2, anchor, every, date, start, early}
  function monthIter(f, t, fn) {
    const a = parse(f), b = parse(t);
    let cur = { y: a.y, m: a.m };
    while (cur.y * 12 + cur.m <= b.y * 12 + b.m) { fn(cur.y, cur.m); cur = addMonths(cur.y, cur.m, 1); }
  }

  function rawDates(it, f, t) {
    const out = [];
    const clamp = (y, m, d) => iso(y, m, Math.min(Math.max(1, d | 0), dim(y, m)));
    switch (it.freq) {
      case 'monthly':
        monthIter(f, t, (y, m) => out.push(clamp(y, m, it.day || 1)));
        break;
      case 'twice':
        monthIter(f, t, (y, m) => { out.push(clamp(y, m, it.day || 1)); out.push(clamp(y, m, it.day2 || 15)); });
        break;
      case 'weekly':
      case 'biweekly': {
        const step = it.freq === 'weekly' ? 7 : 14;
        const an = it.anchor || f;
        const k = Math.ceil((dayNum(f) - dayNum(an)) / step);
        for (let n = dayNum(an) + k * step; n <= dayNum(t); n += step) out.push(fromDayNum(n));
        break;
      }
      case 'months': {
        const an = parse(it.anchor || f);
        const e = Math.max(1, it.every | 0 || 1);
        const base = an.y * 12 + an.m;
        monthIter(f, t, (y, m) => { if ((((y * 12 + m - base) % e) + e) % e === 0) out.push(clamp(y, m, an.d)); });
        break;
      }
      case 'once':
        if (it.date) out.push(it.date);
        break;
      default: break;
    }
    return out;
  }

  function occurrences(it, from, to) {
    if (dayNum(to) < dayNum(from)) return [];
    const f = addDays(from, -3), t = addDays(to, 3);
    let list = rawDates(it, f, t);
    if (it.early) {
      list = list.map((s) => { const w = dow(s); return w === 6 ? addDays(s, -1) : w === 0 ? addDays(s, -2) : s; });
    }
    const lo = dayNum(from), hi = dayNum(to);
    const startN = it.start && it.freq !== 'once' ? dayNum(it.start) : -Infinity;
    const seen = {};
    return list
      .filter((s) => { const n = dayNum(s); return n >= lo && n <= hi && n >= startN; })
      .filter((s) => (seen[s] ? false : (seen[s] = true)))
      .sort();
  }

  /* ---------- profile ---------- */
  const DEFAULT_CATS = ['Groceries', 'Eating out', 'Transport', 'Home', 'Health', 'Fun', 'Kids & pets', 'Other'];

  function newProfile(opts) {
    opts = opts || {};
    const today = opts.today || todayISO();
    return {
      id: uid(), name: opts.name || 'My budget', title: opts.title || 'My calm money plan',
      currency: opts.currency || 'USD', startBalance: 0, created: today,
      setupDone: false, example: false, simple: false,
      ledger: [], bills: [], incomes: [], goals: [], debts: [],
      paid: {}, received: {}, dump: [], snooze: {}, waits: [], autoSkip: {},
      cats: DEFAULT_CATS.map((n) => ({ id: uid(), name: n, limit: null })),
    };
  }

  function newAppData() {
    return { v: 1, activeId: null, profiles: [], theme: 'auto', lastOpened: null, lastBackup: null, changes: 0 };
  }

  const balance = (p) => round2(p.startBalance + p.ledger.reduce((a, e) => a + (e.delta || 0), 0));
  const goalSaved = (p, goalId) => round2(p.ledger.reduce((a, e) => a + (e.goalId === goalId ? (e.goalDelta || 0) : 0), 0));
  const goalReserve = (p) => round2(p.ledger.reduce((a, e) => a + (e.goalId ? (e.goalDelta || 0) : 0), 0));
  const debtBalance = (p, d) => round2(d.balance0 - p.ledger.reduce((a, e) => a + (e.debtId === d.id ? (e.debtPaid || 0) : 0), 0));

  /* ---------- ledger helpers (pure: return new entry, caller pushes) ---------- */
  function entry(type, date, o) {
    return Object.assign({ id: uid(), type, date, delta: 0, amt: 0 }, o || {});
  }
  const spendEntry = (date, amt, cat, note, goalId) =>
    entry('spend', date, { amt, delta: -amt, cat: cat || null, note: note || '', goalId: goalId || undefined, goalDelta: goalId ? -amt : undefined });
  const incomeEntry = (date, amt, note, ref) => entry('income', date, { amt, delta: amt, note: note || '', ref });
  const billEntry = (date, bill, ref) =>
    entry('bill', date, { amt: bill.amount, delta: -bill.amount, note: bill.name, ref, billId: bill.id,
      goalId: bill.goalId || undefined, goalDelta: bill.goalId ? -bill.amount : undefined,
      debtId: bill.debtId || undefined, debtPaid: bill.debtId ? bill.amount : undefined });
  const setAsideEntry = (date, goalId, amt) => entry('goal', date, { amt: Math.abs(amt), delta: 0, goalId, goalDelta: amt, note: amt >= 0 ? 'Set aside' : 'Released' });
  const debtPaymentEntry = (date, debt, amt) => entry('debt', date, { amt, delta: -amt, debtId: debt.id, debtPaid: amt, note: debt.name });
  // money back from a purchase: raises the balance and lowers that category's spending, but is not earned income
  const refundEntry = (date, amt, cat, note) => entry('refund', date, { amt, delta: amt, cat: cat || null, note: note || '' });
  const adjustEntry = (date, delta, note) => entry('adjust', date, { amt: Math.abs(delta), delta, note: note || 'Balance update' });

  /* ---------- paydays ---------- */
  const clampLookback = (p, from, today) => {
    const floor = addDays(today, -400);
    const f = from || p.created;
    return dayNum(f) < dayNum(floor) ? floor : f;
  };

  function nextPayday(p, today) {
    let best = null;
    for (const inc of p.incomes) {
      const occ = occurrences(inc, today, addDays(today, 400));
      for (const d of occ) {
        if (p.received[inc.id + '|' + d]) continue;
        if (!best || dayNum(d) < dayNum(best.date)) best = { date: d, income: inc };
        break;
      }
    }
    return best;
  }

  function overduePaychecks(p, today) {
    const out = [];
    for (const inc of p.incomes) {
      const occ = occurrences(inc, clampLookback(p, inc.start, today), addDays(today, -1));
      for (const d of occ) { const key = inc.id + '|' + d; if (!p.received[key]) out.push({ income: inc, date: d, key }); }
    }
    return out.sort((a, b) => dayNum(a.date) - dayNum(b.date));
  }

  function billsBetween(p, from, to) {
    const out = [];
    for (const b of p.bills) {
      for (const d of occurrences(b, clampLookback(p, b.start, from), to)) {
        if (dayNum(d) < dayNum(from)) continue;
        out.push({ bill: b, date: d, key: b.id + '|' + d, state: p.paid[b.id + '|' + d] ? (p.paid[b.id + '|' + d] === 'skip' ? 'skip' : 'paid') : 'open' });
      }
    }
    return out.sort((a, b) => dayNum(a.date) - dayNum(b.date) || a.bill.name.localeCompare(b.bill.name));
  }

  function overdueBills(p, today) {
    const out = [];
    for (const b of p.bills) {
      for (const d of occurrences(b, clampLookback(p, b.start, today), addDays(today, -1))) {
        const key = b.id + '|' + d;
        if (!p.paid[key]) out.push({ bill: b, date: d, key, overdue: true });
      }
    }
    return out.sort((a, b) => dayNum(a.date) - dayNum(b.date));
  }

  /* ---------- safe to spend ---------- */
  function firstOfNextMonth(today) { const a = parse(today); const n = addMonths(a.y, a.m, 1); return iso(n.y, n.m, 1); }

  function computeSafe(p, today) {
    const bal = balance(p), reserve = goalReserve(p);
    let np = nextPayday(p, today);
    // a paycheck due today that is not in the balance yet must not turn the whole balance into "one day's money";
    // count towards the one after it until the person confirms it arrived (the Right now card asks)
    if (np && np.date === today) np = nextPayday(p, addDays(today, 1)) || np;
    const endISO = np ? np.date : firstOfNextMonth(today);
    const daysLeft = Math.max(1, daysBetween(today, endISO));
    const due = [];
    for (const o of overdueBills(p, today)) due.push(o);
    for (const o of billsBetween(p, today, addDays(endISO, -1))) if (o.state === 'open') due.push({ bill: o.bill, date: o.date, key: o.key, overdue: false });
    const billsTotal = round2(due.reduce((a, o) => a + o.bill.amount, 0));
    // a bill paid from a goal is already protected by the goal's reserve, so only the part the goal cannot cover
    // reduces what is free (otherwise the same money is held back twice)
    const room = {}; p.goals.forEach((g) => { room[g.id] = Math.max(0, goalSaved(p, g.id)); });
    let billsUncovered = 0;
    for (const o of due) {
      const gid = o.bill.goalId; let c = 0;
      if (gid && Object.prototype.hasOwnProperty.call(room, gid)) { c = Math.min(o.bill.amount, room[gid]); room[gid] -= c; }
      o.covered = round2(c); billsUncovered += o.bill.amount - c;
    }
    billsUncovered = round2(billsUncovered);
    const billsCovered = round2(billsTotal - billsUncovered);
    const spendable = round2(bal - reserve - billsUncovered);
    const spentToday = round2(p.ledger.filter((e) => e.type === 'spend' && e.date === today && !e.goalId).reduce((a, e) => a + e.amt, 0));
    const perDay = round2((spendable + spentToday) / daysLeft);
    const left = round2(perDay - spentToday);
    let status = 'ok';
    if (!p.setupDone) status = 'setup';
    else if (spendable < 0) status = 'tight';
    else if (left < 0) status = 'over';
    return { balance: bal, reserve, due, billsTotal, billsUncovered, billsCovered, spendable, nextPay: np, endISO, daysLeft, spentToday, perDay, left, status, noIncome: !np };
  }

  /* ---------- "Right now" ---------- */
  // setup was skipped and nothing has been entered yet
  const isEmptyPlan = (p) => !!p.setupDone && !p.example && p.startBalance === 0 && !p.ledger.length && !p.bills.length && !p.incomes.length;

  function nextStep(p, today, opts) {
    opts = opts || {};
    const dl = opts.dlabel || ((s) => s); // the UI passes a friendly date formatter
    const sn = p.snooze || {};
    const ok = (id) => sn[id] !== today;
    if (!p.setupDone && !p.example) return { id: 'setup', title: 'Set up in 4 small steps', detail: 'About two minutes. You can skip anything.', action: 'setup' };
    if (isEmptyPlan(p) && ok('empty')) return { id: 'empty', title: 'Add what is in your account', detail: 'One number is enough to start. You can add bills and paychecks any time.', action: 'balance' };
    const od = overduePaychecks(p, addDays(today, 1))[0]; // includes today
    if (od && ok('pay|' + od.key)) return { id: 'pay|' + od.key, title: 'Did "' + od.income.name + '" arrive?', detail: (od.date === today ? 'It is due today' : 'It was due ' + dl(od.date)) + ' — tap yes and the balance updates.', action: 'income', ref: od };
    const ob = overdueBills(p, today)[0];
    if (ob && ok('bill|' + ob.key)) return { id: 'bill|' + ob.key, title: 'Is "' + ob.bill.name + '" sorted?', detail: 'It was due ' + dl(ob.date) + ' — mark it paid, or skip it if it no longer applies.', action: 'bill', ref: ob };
    const soon = billsBetween(p, today, addDays(today, 3)).find((o) => o.state === 'open');
    if (soon && ok('soon|' + soon.key)) return { id: 'soon|' + soon.key, title: soon.bill.name + ' is coming up', detail: 'Due ' + dl(soon.date) + ' — one tap when it is paid.', action: 'bill', ref: soon };
    const wt = (p.waits || []).find((w) => w.date < today && ok('wait|' + w.id));
    if (wt) return { id: 'wait|' + wt.id, title: 'Still want "' + wt.name + '"?', detail: 'You gave yourself a day to think. Buy it, or let it go. Both are fine.', action: 'wait', ref: wt };
    if (opts.backupDue && ok('backup')) return { id: 'backup', title: 'Save a backup copy', detail: 'Takes five seconds and keeps your numbers safe.', action: 'backup' };
    if ((opts.hour || 0) >= 18 && !p.ledger.some((e) => e.type === 'spend' && e.date === today) && ok('log') && p.setupDone) {
      return { id: 'log', title: 'Anything to log from today?', detail: 'Or nothing. Both are fine.', action: 'log' };
    }
    return { id: 'allset', title: 'Nothing needs you right now', detail: 'Your plan is up to date.', action: null };
  }

  /* ---------- quick entry: "250 groceries", "+1200 paycheck", "coffee 4.5" ---------- */
  const CAT_WORDS = {
    'Groceries': /grocer|supermarket|food shop|market|aldi|lidl|tesco|walmart|costco|trader|kroger/i,
    'Eating out': /coffee|latte|lunch|dinner|breakfast|restaurant|takeaway|takeout|pizza|burger|cafe|snack|uber ?eats|doordash/i,
    'Transport': /gas|petrol|fuel|uber|lyft|bus|train|metro|taxi|parking|ticket|toll/i,
    'Home': /rent|home|house|cleaning|furniture|ikea|repair|laundry|household/i,
    'Health': /pharmacy|doctor|dentist|medic|vitamin|therapy|gym|prescription/i,
    'Fun': /movie|cinema|game|book|concert|bar|beer|wine|hobby|netflix|spotify|fun/i,
    'Kids & pets': /kid|child|school|toy|baby|diaper|pet|dog|cat|vet/i,
  };
  function guessCat(p, note) {
    for (const c of p.cats) { if (note && note.toLowerCase().includes(c.name.toLowerCase())) return c.name; }
    for (const name of Object.keys(CAT_WORDS)) {
      if (CAT_WORDS[name].test(note || '') && p.cats.some((c) => c.name === name)) return name;
    }
    return null;
  }
  function parseQuick(text) {
    if (!text) return null;
    let s = String(text).trim();
    if (!s) return null;
    let kind = 'spend';
    if (s[0] === '+') { kind = 'income'; s = s.slice(1).trim(); }
    // 12 · 12.50 · 12,5 · 1,000 · 1,000.50 · 1.000,50 (a third decimal digit is a typo, not an amount)
    const m = s.match(/(?:^|\s)[^\d\s-]{0,3}(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d{1,3}(?:\.\d{3})+,\d{1,2}|\d{1,3}(?:\.\d{3}){2,}|\d+(?:[.,]\d{1,2})?)(?!\d)(?![.,]\d)/);
    if (!m) return null;
    const amount = parseMoney(m[1]);
    if (!isFinite(amount) || amount <= 0 || amount > MAX_AMOUNT) return null;
    const note = (s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length)).replace(/\s+/g, ' ').replace(/^[\s$£€¥]+|[\s]+$/g, '').trim();
    return { kind, amount: round2(amount), note };
  }
  // parse a money field the way people type it: "1,200.50", "1200,5", "$40"
  function parseMoney(v) {
    if (typeof v === 'number') return isFinite(v) ? round2(v) : NaN;
    let s = String(v == null ? '' : v).trim().replace(/[^\d.,-]/g, '');
    if (!s) return NaN;
    const lastDot = s.lastIndexOf('.'), lastComma = s.lastIndexOf(',');
    if (lastDot >= 0 && lastComma >= 0) { s = lastComma > lastDot ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); }
    else if (lastComma >= 0) { const frac = s.length - lastComma - 1; s = frac === 3 && s.indexOf(',') === lastComma ? s.replace(',', '') : s.replace(',', '.'); }
    else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, ''); // 1.000.000
    return round2(parseFloat(s));
  }
  const MAX_AMOUNT = 1e9; // anything bigger is a typo, and would break the layout

  /* ---------- summaries ---------- */
  function monthSummary(p, ym) {
    const inM = p.ledger.filter((e) => monthKey(e.date) === ym);
    const income = round2(inM.filter((e) => e.type === 'income').reduce((a, e) => a + e.amt, 0));
    const bills = round2(inM.filter((e) => e.type === 'bill').reduce((a, e) => a + e.amt, 0));
    const refunds = round2(inM.filter((e) => e.type === 'refund').reduce((a, e) => a + e.amt, 0));
    const gross = round2(inM.filter((e) => e.type === 'spend').reduce((a, e) => a + e.amt, 0));
    const debt = round2(inM.filter((e) => e.type === 'debt').reduce((a, e) => a + e.amt, 0));
    // "spent" never goes below zero (a refund for last month's purchase is not negative spending); cash flow still counts the refund in full
    return { income, bills, spending: round2(Math.max(0, gross - refunds)), gross, debt, refunds, kept: round2(income + refunds - bills - gross - debt) };
  }
  /* ---------- statement (a bank-style look at any period) ---------- */
  // key: month | last | 7 | 30 | all | custom ({from,to} in custom)
  function periodRange(key, today, custom, p) {
    const t = parse(today);
    if (key === 'last') { const y = t.m === 1 ? t.y - 1 : t.y, m = t.m === 1 ? 12 : t.m - 1; return { from: iso(y, m, 1), to: iso(y, m, dim(y, m)) }; }
    if (key === '7') return { from: addDays(today, -6), to: today };
    if (key === '30') return { from: addDays(today, -29), to: today };
    if (key === 'all') { const ds = ((p && p.ledger) || []).map((e) => e.date).sort(); return { from: ds[0] && ds[0] < today ? ds[0] : today, to: today }; }
    if (key === 'custom' && custom && /^\d{4}-\d{2}-\d{2}$/.test(custom.from || '') && /^\d{4}-\d{2}-\d{2}$/.test(custom.to || '')) {
      return custom.from <= custom.to ? { from: custom.from, to: custom.to } : { from: custom.to, to: custom.from };
    }
    return { from: iso(t.y, t.m, 1), to: iso(t.y, t.m, dim(t.y, t.m)) };
  }
  // kind: all | spend | in | bills. Totals always cover everything in the period; kind only filters the rows.
  // opts: {q: text to look for in the name, category or amount, cat: one category}; they only filter the rows
  function statement(p, from, to, kind, opts) {
    opts = opts || {};
    const q = String(opts.q || '').trim().toLowerCase().replace(/^[^\d\w]+/, '');
    let opening = p.startBalance || 0, inn = 0, out = 0; const rows = [];
    p.ledger.forEach((e, i) => {
      const dl = e.delta || 0;
      if (e.date < from) { opening += dl; return; }
      if (e.date > to || e.type === 'goal') return;
      if (dl > 0) inn += dl; else out -= dl;
      let keep = kind === 'spend' ? (e.type === 'spend' || e.type === 'refund') : kind === 'in' ? dl > 0 : kind === 'bills' ? (e.type === 'bill' || e.type === 'debt') : true;
      if (keep && opts.cat) keep = (e.cat || (e.type === 'spend' ? 'Other' : '')) === opts.cat;
      if (keep && q) keep = ((e.note || '') + ' ' + (e.cat || '') + ' ' + e.type + ' ' + (+e.amt).toFixed(2)).toLowerCase().includes(q);
      if (keep) rows.push({ e, i });
    });
    rows.sort((a, b) => (a.e.date < b.e.date ? 1 : a.e.date > b.e.date ? -1 : b.i - a.i));

      '<div data-show="twice">' + fld('Second day', 'day2', it.day2 || 15, { num: true }) + '</div>' +
      '<div data-show="biweekly weekly months">' + fld('A date it falls on', 'anchor', it.anchor || t, { type: 'date', hint: 'The next one is fine.' }) + '</div>' +
      '<div data-show="months">' + sel('Every how many months', 'every', [2, 3, 4, 6, 12].map((n) => [n, n + ' months']), it.every || 6) + '</div>' +
      '<div data-show="once">' + fld('Date', 'date', it.date || t, { type: 'date' }) + '</div>' +
      (withEarly ? '<label class="check"><input type="checkbox" name="early"' + (it.early ? ' checked' : '') + '> If it lands on a weekend, it arrives the Friday before</label>' : '');
  }
  function bindSched(form) {
    const upd = () => { const v = form.elements.freq.value; form.querySelectorAll('[data-show]').forEach((el) => { el.hidden = !el.dataset.show.split(' ').includes(v); }); };
    form.elements.freq.addEventListener('change', upd); upd();
  }
  const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
  // money that already happened can't be dated in the future (a planned item belongs in Bills or Money in)
  const FUTURE_MSG = 'That date is in the future. Put planned items in Bills or Money in instead.';
  const pastDate = (fd, name) => { const d = fd.get(name); return isDate(d) ? d : today(); };
  const isFuture = (d) => isDate(d) && d > today();
  function readSched(fd, withEarly) {
    const freq = fd.get('freq'); const it = { freq };
    if (freq === 'monthly' || freq === 'twice') {
      const d = parseInt(fd.get('day'), 10);
      if (!(d >= 1 && d <= 31)) return 'Pick a day between 1 and 31.';
      it.day = d;
      if (freq === 'twice') {
        const d2 = parseInt(fd.get('day2'), 10); if (!(d2 >= 1 && d2 <= 31) || d2 === d) return 'Pick two different days.';
        if (d >= 29 && d2 >= 29) return 'Days 29 to 31 do not exist in every month, so two of them would merge in February. Pick one day up to the 28th.';
        it.day2 = d2;
      }
    } else if (freq === 'biweekly' || freq === 'weekly' || freq === 'months') {
      const a = fd.get('anchor'); if (!isDate(a)) return 'Pick a date.'; it.anchor = a;
      if (freq === 'months') it.every = parseInt(fd.get('every'), 10) || 6;
    } else if (freq === 'once') {
      const d = fd.get('date'); if (!isDate(d)) return 'Pick a date.'; it.date = d;
    }
    if (withEarly) it.early = !!fd.get('early');
    return it;
  }

  /* ---------- ledger actions ---------- */
  function addEntry(e, msg) {
    P.ledger.push(e); save(); render();
    toast(msg, () => { delEntry(e.id); render(); });
  }
  function delEntry(id) {
    const i = P.ledger.findIndex((e) => e.id === id); if (i < 0) return null;
    const e = P.ledger.splice(i, 1)[0]; const rm = [];
    ['paid', 'received'].forEach((m) => Object.keys(P[m]).forEach((k) => { if (P[m][k] === id) { rm.push([m, k]); delete P[m][k]; P.autoSkip[k] = 1; } })); // undoing an autopaid item must not pay it again
    save(); return { e, i, rm };
  }
  function restoreEntry(r) { P.ledger.splice(r.i, 0, r.e); r.rm.forEach((x) => { P[x[0]][x[1]] = r.e.id; delete P.autoSkip[x[1]]; }); save(); }
  function findOcc(key) { const a = key.split('|'); const b = P.bills.find((x) => x.id === a[0]); return b ? { bill: b, date: a[1] } : null; }
  function payBill(key) {
    const o = findOcc(key); if (!o) return;
    const b = o.bill; const e = C.payBillEntry(P, b, key, today());
    P.paid[key] = e.id;
    addEntry(e, b.name + ' marked paid');
  }
  function skipKey(map, key, msg) {
    P[map][key] = 'skip'; save(); render();
    toast(msg, () => { delete P[map][key]; save(); render(); });
  }
  function receive(key) {
    const a = key.split('|'); const inc = P.incomes.find((x) => x.id === a[0]); if (!inc) return;
    const e = C.incomeEntry(today(), inc.amount, inc.name, key);
    P.received[key] = e.id;
    addEntry(e, inc.name + ' added to your balance');
  }
  function setBalance(newBal) {
    if (!P.ledger.length && !P.setupDone) { P.startBalance = newBal; return; }
    const diff = C.round2(newBal - C.balance(P));
    if (diff !== 0) P.ledger.push(C.adjustEntry(today(), diff, 'Balance update'));
  }
  const backupDue = () => {
    if (P.example) return false;
    const c = S.changes || 0;
    if (!S.lastBackup) return c >= 10;
    return c >= 25 || (c >= 3 && C.daysBetween(S.lastBackup, today()) >= 7);
  };

  /* ---------- views ---------- */
  function banners() {
    let h = '';

    if (corrupt) h += '<div class="banner" role="alert">Your saved data could not be read, so a fresh plan was started. A copy of the old data was kept in this browser. If you have a backup file, restore it in More &rarr; Backup.</div>';
    return h;
  }

    }
    // big number
    const next = s.nextPay;

    // right now

        '<div class="chips">' + [5, 10, 20, 50].map((n) => '<button type="button" class="chip" data-act="chip" data-v="' + n + '">' + n + '</button>').join('') + '</div>' +
        '<label for="qnote">What was it? <span class="tag" style="font-weight:400">(optional)</span></label><input id="qnote" name="note" placeholder="coffee, groceries, a gift…" maxlength="60" enterkeyhint="done">' +
        '<p class="label" style="margin:14px 0 0">Category <span class="tag" style="text-transform:none;letter-spacing:0">(optional, I will guess from the words)</span></p>' +
        '<div class="chips" style="margin-top:6px" role="group" aria-label="Category">' + P.cats.map((c) => '<button type="button" class="chip' + (ses.quickCat === c.name ? ' on' : '') + '" data-act="qcat" data-v="' + esc(c.name) + '" aria-pressed="' + (ses.quickCat === c.name) + '">' + esc(c.name) + '</button>').join('') + '</div>' +
        '<label for="qdate">Date of the spend</label><input id="qdate" name="date" type="date" value="' + t + '" max="' + t + '">' +
        '<div class="row" style="justify-content:flex-end;margin-top:10px"><button type="button" class="ghost" data-act="quick-close">Cancel</button></div></div></form>';
      const recent = P.ledger.filter((e) => e.type === 'spend').slice().reverse().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)).slice(0, 3);
      if (recent.length) h += '<p class="label" style="margin:16px 0 0">Recent spending</p><ul class="list" style="margin-top:4px">' + recent.map((e) => '<li><button type="button" class="rowedit grow" data-act="edit-spend" data-id="' + e.id + '" aria-label="Edit">' + esc(e.note || e.cat || 'Spending') + '<br><span class="tag">' + esc(relDay(e.date, t)) + (e.note && e.cat ? ' · ' + esc(e.cat) : '') + '</span></button><span class="amt num">' + fmt(e.amt) + '</span><button class="x" data-act="del-entry" data-id="' + e.id + '" aria-label="Remove">×</button></li>').join('') + '</ul>';

        s.due.slice(0, 5).map((o) => '<li><span class="grow">' + esc(o.bill.name) + '<br><span class="tag">' + (o.overdue ? 'was due ' : 'due ') + dlabel(o.date) + '</span></span><span class="amt num">' + fmt(o.bill.amount) + '</span></li>').join('') + '</ul>' +

    // brain dump
    h += '<section class="card"><details id="dumpBox"' + (ses.dumpOpen ? ' open' : '') + '><summary>Brain dump</summary><p class="muted small">The one place with no amount, no date, no category. It never touches your numbers.</p>' +

  const status = (s) => s.status;

  function howHtml(s) {
    if (status(s) === 'setup') return '';
    const rows = [['Money in your account', fmt(s.balance)]];
    if (s.reserve) rows.push(['Set aside in goals', '&minus; ' + fmt(s.reserve)]);
    rows.push(['Bills before payday (' + s.due.length + ')' + (s.billsCovered ? ', ' + fmt(s.billsCovered) + ' already set aside in goals' : ''), '&minus; ' + fmt(s.billsUncovered)]);
    rows.push(['Free until payday', fmt(s.spendable)]);
    rows.push(['Split over ' + s.daysLeft + (s.daysLeft === 1 ? ' day' : ' days'), fmt(s.perDay) + ' a day']);
    if (s.spentToday) rows.push(['Already spent today', '&minus; ' + fmt(s.spentToday)]);
    rows.push(['Left today', fmt(Math.max(0, s.left))]);
    return '<details class="how"><summary>How is this worked out?</summary><table><tbody>' + rows.map((r, i) => '<tr' + (i === rows.length - 1 ? ' class="total"' : '') + '><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') + '</tbody></table>' +
      (s.due.length ? '<p class="small muted">Bills counted: ' + s.due.map((o) => esc(o.bill.name)).join(', ') + '.</p>' : '') +
      '<p class="small muted">An organizing estimate, not financial advice. Nothing is connected to your bank: the balance is whatever you typed, plus what you logged since.</p>' +
      '<button class="tiny" data-act="balance">Update my balance</button></details>';
  }

  function stepButtons(step) {
    const id = esc(step.id); const k = step.ref ? esc(step.ref.key) : '';
    switch (step.action) {
      case 'setup': return '<div class="chips"><button class="primary" data-act="setup">Start</button></div>';
      case 'balance': return '<div class="chips"><button class="primary" data-act="balance">Add my balance</button><button class="ghost" data-act="snooze" data-id="' + id + '">Later</button></div>';
      case 'income': return '<div class="chips"><button class="primary" data-act="receive" data-key="' + k + '">Yes, it arrived</button><button data-act="snooze" data-id="' + id + '">Not yet</button></div>';
      case 'bill': return '<div class="chips"><button class="primary" data-act="pay" data-key="' + k + '">Mark paid</button><button data-act="skip-bill" data-key="' + k + '">Skip it</button><button class="ghost" data-act="snooze" data-id="' + id + '">Later</button></div>';
      case 'wait': return '<div class="chips"><button class="primary" data-act="wait-buy" data-id="' + esc(step.ref.id) + '">Yes, I will buy it</button><button data-act="wait-drop" data-id="' + esc(step.ref.id) + '">Let it go</button><button class="ghost" data-act="snooze" data-id="' + id + '">Later</button></div>';
      case 'backup': return '<div class="chips"><button class="primary" data-act="backup-dl">Download backup</button><button class="ghost" data-act="snooze" data-id="' + id + '">Later</button></div>';

  function viewBills() {
    const t = today(); const s = C.computeSafe(P, t);
    const od = C.overdueBills(P, t);
    // what is soon (until payday, at least two weeks) stays in view; the rest folds away so a weekly bill does not flood the list
    const soonTo = C.dayNum(s.endISO) > C.dayNum(t) + 14 ? s.endISO : C.addDays(t, 14);
    const allUp = C.billsBetween(P, t, C.addDays(t, 35));
    const up = allUp.filter((o) => C.dayNum(o.date) <= C.dayNum(soonTo)); const later = allUp.filter((o) => C.dayNum(o.date) > C.dayNum(soonTo));
    const recent = P.ledger.filter((e) => e.type === 'bill' && C.daysBetween(e.date, t) <= 30 && C.daysBetween(e.date, t) >= 0).slice().reverse();
    const mode = P.simple ? 'list' : (ses.billsMode || 'list');
    let h = '<div class="row between wrapflex"><h2 style="margin:0">Bills</h2><button class="primary" data-act="bill-add">Add a bill</button></div>';
    if (!P.simple) h += '<div class="chips" role="group" aria-label="Show bills as" style="margin-top:10px"><button class="chip' + (mode === 'list' ? ' on' : '') + '" data-act="bills-mode" data-v="list" aria-pressed="' + (mode === 'list') + '">List</button><button class="chip' + (mode === 'cal' ? ' on' : '') + '" data-act="bills-mode" data-v="cal" aria-pressed="' + (mode === 'cal') + '">Calendar</button></div>';
    if (mode === 'cal') return h + calHtml();
    h += '<div class="card" style="margin-top:12px"><div class="label">Still to go out before payday</div><div class="big num" style="font-size:2rem">' + fmt(s.billsTotal) + '</div><p class="muted small">' + s.due.length + (s.due.length === 1 ? ' bill' : ' bills') + (s.nextPay ? ' until ' + dlabel(s.nextPay.date) : ' until the end of the month') + (s.billsCovered ? ' &middot; ' + fmt(s.billsCovered) + ' of it is already set aside in your goals' : '') + '</p></div>';
    if (od.length) h += '<div class="card amber"><h2>Waiting on you</h2><ul class="list">' + od.map((o) => billRow(o, 'open', true)).join('') + '</ul></div>';
    h += '<div class="card"><h2>Coming up</h2>' + (up.length ? '<ul class="list">' + up.map((o) => billRow(o, o.state, false)).join('') + '</ul>' : '<p class="muted">' + (P.bills.length ? 'Nothing else is due soon.' : 'No bills yet. Add the big ones first: rent, phone, internet.') + '</p>') +
      (later.length ? '<details><summary>Later this month (' + later.length + ')</summary><ul class="list">' + later.map((o) => billRow(o, o.state, false)).join('') + '</ul></details>' : '') +
      (P.bills.length ? '<details><summary>Manage my bills (' + P.bills.length + ')</summary><ul class="list">' + P.bills.map((b) => '<li><span class="grow">' + esc(b.name) + '<br><span class="tag">' + esc(freqLabel(b)) + (b.auto ? ' · autopay' : '') + '</span></span><span class="amt num">' + fmt(b.amount) + '</span><button class="tiny" data-act="bill-edit" data-id="' + b.id + '">Edit</button></li>').join('') + '</ul></details>' : '') + '</div>';
    if (recent.length) h += '<div class="card"><details><summary>Recently paid</summary><ul class="list">' + recent.map((e) => '<li><span class="grow">' + esc(e.note) + '<br><span class="tag">' + dlabel(e.date) + '</span></span><span class="amt num">' + fmt(e.amt) + '</span><button class="tiny ghost" data-act="del-entry" data-id="' + e.id + '">Undo</button></li>').join('') + '</ul></details></div>';
    if (P.bills.length || P.incomes.length) h += '<div class="chips"><button class="ghost" data-act="ics">Add bills and paydays to my phone calendar</button></div>';
    return h;
  }
  function billRow(o, state, overdue) {
    const k = esc(o.key); const b = o.bill;

  }

  function viewIncome() {
    const t = today(); const np = C.nextPayday(P, t); const due = C.overduePaychecks(P, C.addDays(t, 1));
    const ym = C.monthKey(t); const ms = C.monthSummary(P, ym);
    let h = '<div class="row between wrapflex"><h2 style="margin:0">Money in</h2><button class="primary" data-act="income-add">Add a paycheck</button></div>';
    if (due.length) h += '<div class="card sage" style="margin-top:12px"><h2>Did it arrive?</h2><ul class="list">' + due.map((o) => '<li style="flex-wrap:wrap"><span class="grow">' + esc(o.income.name) + '<br><span class="tag">' + dlabel(o.date) + '</span></span><span class="amt num">' + fmt(o.income.amount) + '</span><span class="row"><button class="tiny primary" data-act="receive" data-key="' + esc(o.key) + '">Yes</button><button class="tiny" data-act="skip-income" data-key="' + esc(o.key) + '">Skip</button></span></li>').join('') + '</ul></div>';
    h += '<div class="card" style="margin-top:12px"><div class="label">Next payday</div>' + (np ? '<div class="big num" style="font-size:2rem">' + dlabel(np.date) + '</div><p class="muted">' + rel(np.date) + ' &middot; ' + esc(np.income.name) + ' &middot; ' + fmt(np.income.amount) + '</p>' : '<p class="muted">No paycheck yet. Add one so the countdown to payday works.</p>') + '</div>';
    h += '<div class="card"><h2>My paychecks</h2>' + (P.incomes.length ? '<ul class="list">' + P.incomes.map((i) => '<li><span class="grow">' + esc(i.name) + '<br><span class="tag">' + esc(freqLabel(i)) + (i.early ? ' · early if weekend' : '') + '</span></span><span class="amt num">' + fmt(i.amount) + '</span><button class="tiny" data-act="income-edit" data-id="' + i.id + '">Edit</button></li>').join('') + '</ul>' : '<p class="muted">Monthly benefit plus a wage? Add each one with its own schedule. The countdown follows whichever lands next.</p>') +
      '<div class="chips"><button data-act="oneoff">Add one-off money (refund, gift)</button></div></div>';
    h += '<div class="card"><h2>This month</h2><div class="grid2"><div><div class="label">Came in</div><div class="amt num">' + fmt(ms.income) + '</div></div><div><div class="label">Went out</div><div class="amt num">' + fmt(ms.bills + ms.spending + ms.debt) + '</div></div></div><p class="muted small">Kept so far: ' + fmt(ms.kept) + '</p></div>';
    return h;
  }

  function viewSpend() {
    const t = today(); const ym = C.monthKey(t); const cs = C.catSpending(P, ym); const ms = C.monthSummary(P, ym);
    let h = '<div class="row between wrapflex"><h2 style="margin:0">Spending</h2><button class="primary" data-act="spend-add">Log spending</button></div>';
    h += '<div class="card" style="margin-top:12px"><div class="label">Spent this month</div><div class="big num" style="font-size:2rem">' + fmt(ms.spending) + '</div>' + (ms.refunds ? '<p class="muted small">Refunds this month: +' + fmt(ms.refunds) + '</p>' : '') + '</div>';
    const envRow = (c) => {
      const sp = cs[c.name] || 0; const lim = c.limit; const pct = lim ? Math.min(100, Math.round(sp / lim * 100)) : (sp ? 100 : 0);
      return '<li style="flex-wrap:wrap"><span class="grow">' + esc(c.name) + (lim ? '<div class="bar' + (sp > lim ? ' over' : '') + '"><i style="width:' + pct + '%"></i></div>' : '') + '</span>' +
        '<span class="amt num">' + fmt(sp) + (lim ? ' <span class="tag">of ' + fmt(lim) + (sp > lim ? ' · a little over, that is okay' : '') + '</span>' : '') + '</span><button class="tiny ghost" data-act="cat-limit" data-id="' + c.id + '">' + (lim ? 'Limit' : 'Set limit') + '</button></li>';
    };
    const names = Object.keys(cs).sort((a, b) => cs[b] - cs[a]); const tot = names.reduce((a, n) => a + cs[n], 0);
    if (names.length) {
      const prev = C.catSpending(P, C.monthKey(C.periodRange('last', t).from));
      h += '<div class="card"><h2>Where it went</h2><ul class="list">' + names.map((n) => {
        const pct = Math.round(cs[n] / tot * 100);
        return '<li style="flex-wrap:wrap"><span class="grow">' + esc(n) + ' <span class="tag">' + pct + '%' + (prev[n] ? ' · last month ' + esc(fmt(prev[n])) : '') + '</span><div class="sharebar" role="img" aria-label="' + pct + ' percent"><i style="width:' + pct + '%"></i></div></span><span class="amt num">' + fmt(cs[n]) + '</span></li>';

    }

      (used.length ? '<ul class="list">' + used.map(envRow).join('') + '</ul>' : '<p class="muted">Nothing spent yet this month.</p>') +
      (rest.length ? '<details><summary>' + (used.length ? 'Other envelopes (' + rest.length + ')' : 'All envelopes (' + rest.length + ')') + '</summary><ul class="list">' + rest.map(envRow).join('') + '</ul></details>' : '') + '</div>';
    h += stmtCard(t);
    return h;
  }

  /* ---------- statement: every movement in a chosen period ---------- */
  const stmtState = () => ses.stmt || (ses.stmt = { period: 'month', kind: 'all', from: '', to: '', q: '', cat: '' });
  const stmtData = () => { const st = stmtState(); const r = C.periodRange(st.period, today(), st, P); return C.statement(P, r.from, r.to, st.kind, { q: st.q, cat: st.cat }); };
  function stmtCard(t) {
    const st = stmtState(); const d = stmtData();
    const opt = (list, cur) => list.map((x) => '<option value="' + x[0] + '"' + (x[0] === cur ? ' selected' : '') + '>' + x[1] + '</option>').join('');
    const yr = t.slice(0, 4);
    const dayHead = (s) => relDay(s, t) + (s.slice(0, 4) !== yr ? ' ' + s.slice(0, 4) : '');
    let h = '<div class="card" id="stmt"><h2>Statement</h2>' +
      '<div class="grid2"><div><label for="stP" style="margin-top:0">Period</label><select id="stP" data-stmt="period">' + opt([['month', 'This month'], ['last', 'Last month'], ['7', 'Last 7 days'], ['30', 'Last 30 days'], ['all', 'Everything'], ['custom', 'Choose dates…']], st.period) + '</select></div>' +
      '<div><label for="stK" style="margin-top:0">Show</label><select id="stK" data-stmt="kind">' + opt([['all', 'Everything'], ['spend', 'Spending'], ['in', 'Money in'], ['bills', 'Bills & debts']], st.kind) + '</select></div></div>';
    if (st.period === 'custom') h += '<div class="grid2"><div><label for="stF">From</label><input id="stF" type="date" data-stmt="from" value="' + d.from + '" max="' + t + '"></div><div><label for="stT">To</label><input id="stT" type="date" data-stmt="to" value="' + d.to + '" max="' + t + '"></div></div>';
    h += '<div class="grid2"><div><label for="stQ">Search</label><input id="stQ" type="search" data-stmt="q" value="' + esc(st.q) + '" placeholder="name, envelope or amount" autocomplete="off"></div>' +
      '<div><label for="stC">Envelope</label><select id="stC" data-stmt="cat">' + opt([['', 'All']].concat(P.cats.map((c) => [esc(c.name), esc(c.name)])), esc(st.cat)) + '</select></div></div>';
    h += '<p class="muted small" style="margin:10px 0 4px">' + esc(dlabelY(d.from)) + (d.to !== d.from ? ' – ' + esc(dlabelY(d.to)) : '') + '</p>' +
      '<div class="grid2 stmtsum"><div><div class="label">Start of period</div><div class="amt num">' + fmt(d.opening) + '</div></div><div><div class="label">End of period</div><div class="amt num">' + fmt(d.closing) + '</div></div>' +
      '<div><div class="label">Money in</div><div class="amt num pos">+' + fmt(d.in) + '</div></div><div><div class="label">Money out</div><div class="amt num">&minus;' + fmt(d.out) + '</div></div></div>';
    if (!d.rows.length) return h + '<p class="muted" style="margin-top:12px">' + (st.q || st.cat ? 'Nothing matches that search in this period.' : 'Nothing in this period.') + '</p></div>';
    const LIMIT = 200; let last = '';
    h += '<ul class="list stmtlist" style="margin-top:6px">';
    d.rows.slice(0, LIMIT).forEach((x) => {
      const e = x.e;
      if (e.date !== last) { last = e.date; h += '<li class="dayhead" aria-hidden="false"><span class="label">' + esc(dayHead(e.date)) + '</span></li>'; }
      const name = esc(entryText(e)) + (e.cat && e.note ? ' <span class="tag">' + esc(e.cat) + '</span>' : '');
      h += '<li><button type="button" class="rowedit grow" data-act="' + (e.type === 'spend' ? 'edit-spend' : 'edit-entry') + '" data-id="' + e.id + '" aria-label="Edit">' + name + '</button>' +
        '<span class="amt num' + (e.delta > 0 ? ' pos' : '') + '">' + (e.delta > 0 ? '+' : e.delta < 0 ? '&minus;' : '') + fmt(Math.abs(e.amt)) + '</span><button class="x" data-act="del-entry" data-id="' + e.id + '" aria-label="Remove">×</button></li>';
    });
    h += '</ul>' + (d.rows.length > LIMIT ? '<p class="muted small">Showing the latest ' + LIMIT + ' of ' + d.rows.length + '. Pick a shorter period to see the rest.</p>' : '');
    return h + '<div class="chips"><button data-act="csv">Download this statement (CSV)</button></div></div>';
  }
  function entryText(e) {
    switch (e.type) {
      case 'spend': return e.note || e.cat || 'Spending';
      case 'bill': return e.note || 'Bill';
      case 'income': return e.note || 'Money in';
      case 'refund': return 'Refund · ' + (e.note || e.cat || '');
      case 'debt': return 'Extra payment · ' + (e.note || '');
      case 'adjust': return 'Balance update';
      default: return e.note || '';
    }
  }

  // received (counted in the balance) | skipped | waiting (past, not confirmed yet) | expected (still ahead)
  function payState(inc, date, t) {
    const v = P.received[inc.id + '|' + date];
    return v === 'skip' ? 'skipped' : v ? 'received' : date < t ? 'waiting' : 'expected';
  }
  function calHtml() {
    const t = today(); if (!calYM) calYM = C.monthKey(t);
    const y = +calYM.slice(0, 4), m = +calYM.slice(5, 7);
    const first = C.iso(y, m, 1), last = C.iso(y, m, C.dim(y, m));
    const bills = C.billsBetween(P, first, last);
    const pays = []; P.incomes.forEach((inc) => C.occurrences(inc, first, last).forEach((d) => pays.push({ inc, date: d, st: payState(inc, d, t) })));
    const byDay = {}; const get = (d) => (byDay[d] = byDay[d] || { bills: [], pays: [], sp: [] });
    bills.forEach((o) => get(o.date).bills.push(o)); pays.forEach((o) => get(o.date).pays.push(o));
    P.ledger.filter((e) => e.type === 'spend' && C.monthKey(e.date) === calYM).forEach((e) => get(e.date).sp.push(e));
    const lead = C.dow(first); const title = new Date(y, m - 1, 1).toLocaleDateString(DLOC, { month: 'long', year: 'numeric' });
    const ms = C.monthSummary(P, calYM);
    let h = '<div class="card"><div class="row between"><button class="tiny" data-act="cal-prev" aria-label="Previous month">&larr;</button><h2 style="margin:0">' + esc(title) + '</h2><button class="tiny" data-act="cal-next" aria-label="Next month">&rarr;</button></div><div class="cal" style="margin-top:10px">' +
      ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d) => '<div class="dow">' + d + '</div>').join('') + '<button class="empty" tabindex="-1" aria-hidden="true"></button>'.repeat(lead);
    for (let d = 1; d <= C.dim(y, m); d++) {
      const iso = C.iso(y, m, d); const x = byDay[iso];
      const dots = x ? x.bills.map((o) => '<i class="dot' + (o.state === 'paid' ? ' paid' : '') + '"></i>').join('') + x.pays.map((o) => '<i class="dot pay' + (o.st === 'received' ? ' got' : o.st === 'waiting' ? ' wait' : o.st === 'skipped' ? ' skipd' : '') + '"></i>').join('') + (x.sp.length ? '<i class="dot sp"></i>' : '') : '';
      h += '<button data-act="cal-day" data-d="' + iso + '" class="' + (iso === t ? 'today' : '') + '" aria-pressed="' + (calDay === iso) + '" aria-label="' + esc(dlabel(iso)) + '">' + d + '<span class="dots">' + dots + '</span></button>';
    }
    h += '</div><p class="tag" style="margin-top:8px"><i class="dot" style="display:inline-block"></i> bill &nbsp;<i class="dot paid" style="display:inline-block"></i> paid &nbsp;<i class="dot pay" style="display:inline-block"></i> payday ahead &nbsp;<i class="dot pay got" style="display:inline-block"></i> received &nbsp;<i class="dot pay wait" style="display:inline-block"></i> to confirm &nbsp;<i class="dot sp" style="display:inline-block"></i> spending</p></div>';
    if (calDay && C.monthKey(calDay) === calYM) {
      const x = byDay[calDay] || { bills: [], pays: [], sp: [] };
      h += '<div class="card"><h2>' + esc(dlabel(calDay)) + '</h2>';
      const rows = [];
      x.pays.forEach((o) => rows.push('<li><span class="grow">' + esc(o.inc.name) + ' <span class="pill' + (o.st === 'received' ? ' ok' : '') + '">' + (o.st === 'received' ? 'received' : o.st === 'skipped' ? 'skipped' : o.st === 'waiting' ? 'did it arrive?' : 'payday') + '</span></span><span class="amt num">+' + fmt(o.inc.amount) + '</span></li>'));
      x.bills.forEach((o) => rows.push('<li><span class="grow">' + esc(o.bill.name) + ' <span class="pill' + (o.state === 'paid' ? ' ok' : '') + '">' + (o.state === 'paid' ? 'paid' : o.state === 'skip' ? 'skipped' : 'due') + '</span></span><span class="amt num">' + fmt(o.bill.amount) + '</span></li>'));
      x.sp.forEach((e) => rows.push('<li><span class="grow">' + esc(e.note || e.cat || 'Spending') + '</span><span class="amt num">' + fmt(e.amt) + '</span></li>'));
      h += rows.length ? '<ul class="list">' + rows.join('') + '</ul>' : '<p class="muted">A quiet day.</p>';
      h += '</div>';
    }
    h += '<div class="card"><h2>Month at a glance</h2><div class="grid2"><div><div class="label">Came in</div><div class="amt num">' + fmt(ms.income) + '</div></div><div><div class="label">Bills paid</div><div class="amt num">' + fmt(ms.bills) + '</div></div><div><div class="label">Spending</div><div class="amt num">' + fmt(ms.spending) + '</div></div><div><div class="label">Kept</div><div class="amt num">' + fmt(ms.kept) + '</div></div></div></div>';
    return h;
  }

  function viewMore() {
    if (sub) return SUB[sub]();
    const item = (k, t, d) => '<li><button style="width:100%;justify-content:space-between;text-align:left" data-act="sub" data-sub="' + k + '"><span><b>' + t + '</b><br><span class="muted small">' + d + '</span></span><span>&rsaquo;</span></button></li>';
    return '<h2>More</h2><ul class="list" style="display:grid;gap:8px">' +
      (!P.simple || P.goals.length ? item('goals', 'Goals', 'Set money aside for things like car insurance or a holiday') : '') +
      (P.simple ? '' : item('debts', 'Debts', 'Track what you owe and see roughly when it is paid off') + item('subs', 'Subscriptions &amp; small leaks', 'What repeats, and what it adds up to in a year') + item('wait', 'Wait list', 'Give a purchase a day before you decide')) +
      item('backup', 'Backup &amp; move to another device', 'Download, restore, or copy as text') + item('budgets', 'My budgets', 'Switch, or add another budget (family, holiday, business)') +
      item('settings', 'Settings', 'Name, currency, colors, simple mode') + item('help', 'Help', 'How the number is worked out, privacy, install on your phone') + '</ul>' +
      '<p class="muted small center" style="margin-top:18px">Money Reset by ToriReset &middot; gentle reset tools for ADHD brains</p>';
  }
  const back = (t) => '<div class="row" style="margin-bottom:8px"><button class="tiny" data-act="sub" data-sub="">&larr; More</button><h2 style="margin:0">' + t + '</h2></div>';

  const monthsText = (n) => { const y = Math.floor(n / 12), m = n % 12; return n < 1 ? 'under a month' : (y ? y + (y === 1 ? ' year' : ' years') + (m ? ' ' : '') : '') + (m ? m + (m === 1 ? ' month' : ' months') : ''); };
  // a rough estimate: same payment every month, interest on the balance. Not a lender's figure.
  function payoffHtml(d) {
    if (!d.min) return '<p class="small muted">Add the minimum payment (Edit) to see roughly when it is paid off.</p>';
    const extra = ses.extra && ses.extra[d.id] > 0 ? ses.extra[d.id] : 50;
    const pl = C.payoffPlan(P, d, extra); if (!pl) return '';
    if (!pl.base) return '<p class="small muted">At the minimum, the payments do not cover the interest, so the balance would not go down. Even a little extra helps.</p>';
    let h = '<p class="small muted">At the minimum: about <b>' + monthsText(pl.base.months) + '</b>' + (d.rate ? ' and ' + fmt(pl.base.interest) + ' in interest' : '') + '.';
    if (pl.more) h += ' With ' + fmt(extra) + ' extra a month: about <b>' + monthsText(pl.more.months) + '</b>' + (pl.base.months > pl.more.months ? ', ' + monthsText(pl.base.months - pl.more.months) + ' sooner' : '') + (d.rate && pl.base.interest > pl.more.interest ? ' and ' + fmt(C.round2(pl.base.interest - pl.more.interest)) + ' less interest' : '') + '.';
    return h + ' <button class="linkbtn" data-act="debt-extra" data-id="' + d.id + '">Try another amount</button></p><p class="hint">A rough estimate, not a lender\'s figure.</p>';
  }
  const SUB = {
    goals() {
      let h = back('Goals') + '<p class="muted small">Money you set aside stays in your account, but is taken out of what you can spend. Good for bills that come every few months.</p>';
      h += P.goals.length ? P.goals.map((g) => {
        const sv = C.goalSaved(P, g.id); const pct = g.target ? Math.max(0, Math.min(100, Math.round(sv / g.target * 100))) : 0;
        const pl = C.goalPlan(P, g, today()); const lb = pl && pl.bill;
        let note = '';
        if (pl && pl.done) note = '<p class="small muted">' + (lb ? 'Enough is set aside for &ldquo;' + esc(lb.name) + '&rdquo;.' : 'You have reached it.') + '</p>';
        else if (pl && pl.past) note = '<p class="small muted">The target date has passed. Edit the goal and pick a new date to see a monthly amount.</p>';
        else if (pl && pl.perMonth != null) note = '<p class="small muted">' + fmt(pl.remaining) + ' still to set aside, ' + pl.months + (pl.months === 1 ? ' month' : ' months') + ' to go' + (lb ? ' until &ldquo;' + esc(lb.name) + '&rdquo; on ' + esc(dlabel(pl.due)) : ' (by ' + esc(dlabel(pl.due)) + ')') + '. About <b>' + fmt(pl.perMonth) + ' a month</b> gets you there.</p>';
        else if (lb) note = '<p class="small muted">Linked to &ldquo;' + esc(lb.name) + '&rdquo;.</p>';
        return '<div class="card"><div class="row between"><h3>' + esc(g.name) + '</h3><span class="amt num">' + fmt(sv) + (g.target ? ' <span class="tag">of ' + fmt(g.target) + '</span>' : '') + '</span></div>' + (g.target ? '<div class="bar"><i style="width:' + pct + '%"></i></div>' : '') + note +
          '<div class="chips"><button class="tiny primary" data-act="goal-in" data-id="' + g.id + '">Set aside</button><button class="tiny" data-act="goal-out" data-id="' + g.id + '">Release</button><button class="tiny" data-act="goal-spend" data-id="' + g.id + '">Spend from it</button><button class="tiny ghost" data-act="goal-edit" data-id="' + g.id + '">Edit</button></div></div>';
      }).join('') : '<div class="card"><p class="muted">No goals yet.</p></div>';
      return h + '<button class="primary" data-act="goal-add">Add a goal</button>';
    },
    debts() {
      const order = P.debtOrder || 'rate';
      let h = back('Debts') + '<div class="chips" style="margin:0 0 10px"><button class="tiny' + (order === 'rate' ? ' primary' : '') + '" data-act="debt-order" data-v="rate">Highest rate first</button><button class="tiny' + (order === 'balance' ? ' primary' : '') + '" data-act="debt-order" data-v="balance">Smallest balance first</button></div>';
      const list = C.sortDebts(P, order); const paidOff = P.debts.filter((d) => C.debtBalance(P, d) <= 0);
      h += list.length ? list.map((d, i) => '<div class="card"><div class="row between"><h3>' + esc(d.name) + (i === 0 && list.length > 1 ? ' <span class="pill ok">pay extra here first</span>' : '') + '</h3><span class="amt num">' + fmt(C.debtBalance(P, d)) + '</span></div><p class="small muted">' + [d.min ? 'Minimum ' + fmt(d.min) : '', d.rate ? d.rate + '% rate' : ''].filter(Boolean).join(' &middot; ') + '</p>' + payoffHtml(d) + '<div class="chips"><button class="tiny primary" data-act="debt-pay" data-id="' + d.id + '">Record a payment</button><button class="tiny ghost" data-act="debt-edit" data-id="' + d.id + '">Edit</button></div></div>').join('') : '<div class="card"><p class="muted">No debts being tracked.</p></div>';
      if (paidOff.length) h += '<div class="card sage"><b>Paid off &#127881;</b> ' + paidOff.map((d) => esc(d.name)).join(', ') + '</div>';
      return h + '<button class="primary" data-act="debt-add">Add a debt</button>';
    },
    subs() {
      const t = today();
      const subs = P.bills.filter((b) => b.sub); const maybe = P.bills.filter((b) => !b.sub && C.looksLikeSub(b));
      const yearly = C.round2(subs.reduce((a, b) => a + C.perYear(b), 0));
      let h = back('Subscriptions') + '<p class="muted small">Mark a bill as a subscription (Bills &rarr; tap its name) and it shows up here with its cost over a year. Nothing is cancelled for you.</p>';
      h += '<div class="card">' + (subs.length ? '<div class="row between"><h2 style="margin:0">Subscriptions</h2><span class="amt num">' + fmt(yearly) + ' <span class="tag">a year</span></span></div><ul class="list">' +
        subs.map((b) => '<li><span class="grow">' + esc(b.name) + '<br><span class="tag">' + esc(freqLabel(b)) + ' · ' + fmt(C.perYear(b)) + ' a year</span></span><span class="amt num">' + fmt(b.amount) + '</span><button class="tiny" data-act="bill-edit" data-id="' + b.id + '">Review</button></li>').join('') + '</ul>' : '<p class="muted">None marked yet.</p>') + '</div>';
      if (maybe.length) h += '<div class="card"><h3>Look like subscriptions</h3><ul class="list">' + maybe.map((b) => '<li><span class="grow">' + esc(b.name) + '<br><span class="tag">' + fmt(C.perYear(b)) + ' a year</span></span><button class="tiny" data-act="sub-mark" data-id="' + b.id + '">Mark as subscription</button></li>').join('') + '</ul></div>';
      const lk = C.leaks(P, t);
      h += '<div class="card"><h2>Small things that add up</h2><p class="muted small">The same thing logged three or more times in the last 30 days.</p>' +
        (lk.length ? '<ul class="list">' + lk.map((m) => '<li><span class="grow">' + esc(m.name) + '<br><span class="tag">' + m.count + ' times</span></span><span class="amt num">' + fmt(m.total) + '</span></li>').join('') + '</ul><p class="muted small">No judgment. Some of these are exactly worth it. This only shows what repeats.</p>' : '<p class="muted">Nothing repeats much right now.</p>') + '</div>';
      return h;
    },
    wait() {

  /* ---------- render ---------- */
  function applyTheme() {
    const th = S.theme || 'auto';
    if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th);
  }
  const VIEWS = { today: viewToday, bills: viewBills, income: viewIncome, spend: viewSpend, more: viewMore };
  function render() {
    applyTheme();
    if (!VIEWS[view]) view = 'today';
    // autopay: bills and paychecks the person opted in are counted on their due date
    if (!P.example) {
      const auto = C.applyAuto(P, today());
      if (auto.length) { save(); toast(auto.length === 1 ? auto[0].name + ' counted automatically' : auto.length + ' items counted automatically (autopay)'); }
    }
    $('#appSub').textContent = P.title + (S.profiles.length > 1 ? ' · ' + P.name : '');
    document.querySelectorAll('#tabs button').forEach((b) => { if (b.dataset.view === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    $('#app').innerHTML = banners() + VIEWS[view]();
    if (ses.focusQuick) { ses.focusQuick = false; const q = $('#quick'); if (q) q.focus(); }
  }

  /* ---------- modal flows ---------- */
  function money(fd, name, o) {
    o = o || {}; const v = C.parseMoney(fd.get(name));
    if (!Number.isFinite(v)) return o.optional && !String(fd.get(name) || '').trim() ? null : 'Type an amount, like 12.50';
    if (!o.negOk && v <= 0) return 'The amount needs to be more than zero.';
    if (Math.abs(v) > 1e9) return 'That is a very big number. Please check it.';
    return v;
  }
  const isErr = (v) => typeof v === 'string';

  function billModal(b) {

      '<div data-show="months"><p class="hint" id="spreadHint" aria-live="polite"></p>' +
      (edit && b.goalId ? '' : '<label class="check"><input type="checkbox" name="fund"' + (edit ? '' : ' checked') + '> Set money aside a little each month for it (makes a goal)</label>') + '</div>' +
      '<label class="check"><input type="checkbox" name="auto"' + (edit && b.auto ? ' checked' : '') + '> Count it as paid on the due date (autopay)</label>' +
      '<label class="check"><input type="checkbox" name="sub"' + (edit && b.sub ? ' checked' : '') + '> This is a subscription I might want to review</label>',
      {
        submit: edit ? 'Save' : 'Add bill',
        onOpen(form) {
          bindSched(form);
          const hint = () => {
            const a = C.parseMoney(form.elements.amount.value), n = parseInt(form.elements.every.value, 10) || 6;
            $('#spreadHint').textContent = Number.isFinite(a) && a > 0 && form.elements.freq.value === 'months' ? 'That is about ' + fmt(C.round2(a / n)) + ' a month, ' + fmt(C.perYear({ amount: a, freq: 'months', every: n })) + ' a year.' : '';
          };
          ['amount', 'every', 'freq'].forEach((n) => form.elements[n].addEventListener('input', hint)); form.elements.freq.addEventListener('change', hint); form.elements.every.addEventListener('change', hint); hint();
        },
        extra: edit ? '<button type="button" class="danger" data-act="bill-del" data-id="' + b.id + '">Delete</button>' : '',
        onSubmit(fd) {
          const name = String(fd.get('name') || '').trim(); if (!name) return 'Give it a name.';
          const amt = money(fd, 'amount'); if (isErr(amt)) return amt;
          const sch = readSched(fd, false); if (isErr(sch)) return sch;
          let goalId = fd.get('goalId') || undefined;
          if (!goalId && sch.freq === 'months' && fd.get('fund') && !(edit && b.goalId)) { const g = { id: C.uid(), name, target: 0 }; P.goals.push(g); goalId = g.id; }
          const auto = !!fd.get('auto'), sub = !!fd.get('sub');
          const flags = { auto: auto || undefined, autoFrom: auto ? (edit && b.auto && b.autoFrom ? b.autoFrom : today()) : undefined, sub: sub || undefined };
          if (edit) {
            Object.assign(b, sch, { name, amount: amt, goalId }, flags);
            const d = b.debtId && P.debts.find((x) => x.id === b.debtId); if (d) d.min = amt; // the debt's minimum follows its bill
          } else P.bills.push(Object.assign({ id: C.uid(), name, amount: amt, goalId, start: today() }, sch, flags));
          save(); render(); toast(edit ? 'Bill saved' : name + ' added');
        },
      });
  }

          if (edit) Object.assign(inc, sch, { name, amount: amt }, flags); else P.incomes.push(Object.assign({ id: C.uid(), name, amount: amt, start: today() }, sch, flags));

  function balanceModal() {

        const before = C.balance(P); setBalance(v); save(); ses.catchDismissed = true; render(); toast('Balance is now ' + fmt(v), () => { const last = P.ledger[P.ledger.length - 1]; if (last && last.type === 'adjust' && C.balance(P) !== before) { delEntry(last.id); render(); } });

  function spendModal() {
    modal('Log spending', fld('Amount', 'amount', '', { money: true }) + fld('What was it?', 'note', '', { ph: 'coffee, groceries…', max: 60 }) + sel('Envelope', 'cat', [['', 'Pick for me']].concat(P.cats.map((c) => [c.name, c.name])), '') + fld('Date', 'date', today(), { type: 'date', max2: today() }), {

  // folds the extra "Log a spend" options away; with clear it also forgets whatever was typed
  function closeQuick(clear) {

    const f = $('form[data-form="quick"]'); if (!f) return;
    if (clear) f.reset();
    const m = $('#quickMore'); if (m) m.hidden = true;

    if (document.activeElement && f.contains(document.activeElement)) document.activeElement.blur();
  }
  const quickEmpty = (f) => !f.elements.q.value.trim() && !(f.elements.note && f.elements.note.value.trim()) && !ses.quickCat;
  // any other entry (a paid bill, a paycheck, a debt payment): fix the amount or the date, e.g. the electric bill came out different
  function editAmountModal(id) {
    const e = P.ledger.find((x) => x.id === id); if (!e || e.type === 'goal') return;
    modal('Edit this entry', '<p class="muted">' + esc(entryText(e)) + '</p>' + fld('Amount', 'amount', e.amt, { money: true }) + fld('Date', 'date', e.date, { type: 'date', max2: today() }), {
      submit: 'Save',
      onSubmit(fd) {
        const amt = money(fd, 'amount'); if (isErr(amt)) return amt;
        if (isFuture(fd.get('date'))) return FUTURE_MSG;
        const before = Object.assign({}, e); const sign = e.delta < 0 ? -1 : 1;
        e.amt = amt; e.delta = sign * amt; if (e.goalId) e.goalDelta = sign * amt; if (e.debtId && e.type !== 'spend') e.debtPaid = amt;
        e.date = isDate(fd.get('date')) ? fd.get('date') : e.date;
        save(); render(); toast('Saved', () => { Object.assign(e, before); save(); render(); });
      },
    });
  }
  function editSpendModal(id) {
    const e = P.ledger.find((x) => x.id === id && x.type === 'spend'); if (!e) return;
    const cats = P.cats.map((c) => c.name); if (e.cat && !cats.includes(e.cat)) cats.push(e.cat);
    modal('Edit this spend', fld('Amount', 'amount', e.amt, { money: true }) + fld('What was it?', 'note', e.note, { ph: 'coffee, groceries…', max: 60 }) + sel('Envelope', 'cat', cats.map((n) => [n, n]), e.cat || 'Other') + fld('Date', 'date', e.date, { type: 'date', max2: today() }), {
      submit: 'Save',
      extra: '<button type="button" data-act="spend-again" data-id="' + e.id + '">Log again today</button>',
      onSubmit(fd) {
        const amt = money(fd, 'amount'); if (isErr(amt)) return amt;
        if (isFuture(fd.get('date'))) return FUTURE_MSG;
        const before = Object.assign({}, e);
        e.amt = amt; e.delta = -amt; if (e.goalId) e.goalDelta = -amt;
        e.note = String(fd.get('note') || '').trim(); e.cat = fd.get('cat') || e.cat; e.date = isDate(fd.get('date')) ? fd.get('date') : e.date;
        save(); render(); toast('Saved', () => { Object.assign(e, before); save(); render(); });
      },
    });
  }
  function oneOffModal() {
    modal('Add one-off money',
      sel('What kind?', 'kind', [['in', 'Money in (gift, side income)'], ['refund', 'Refund for something I bought']], 'in') +
      fld('Amount', 'amount', '', { money: true }) + fld('What was it?', 'note', '', { ph: 'gift, returned shoes…', max: 60 }) +
      '<div data-show="refund">' + sel('Takes it off which envelope?', 'cat', [['', 'Pick for me']].concat(P.cats.map((c) => [c.name, c.name])), '') + '</div>' +
      fld('Date', 'date', today(), { type: 'date', max2: today() }), {
        submit: 'Add',
        onOpen(form) {
          const upd = () => form.querySelectorAll('[data-show]').forEach((el) => { el.hidden = el.dataset.show !== form.elements.kind.value; });
          form.elements.kind.addEventListener('change', upd); upd();
        },
        onSubmit(fd) {
          const amt = money(fd, 'amount'); if (isErr(amt)) return amt;
          if (isFuture(fd.get('date'))) return FUTURE_MSG;
          const date = pastDate(fd, 'date'), note = String(fd.get('note') || '').trim();
          if (fd.get('kind') === 'refund') addEntry(C.refundEntry(date, amt, fd.get('cat') || C.guessCat(P, note) || 'Other', note || 'Refund'), fmt(amt) + ' refund added');
          else addEntry(C.incomeEntry(date, amt, note || 'Money in'), fmt(amt) + ' added');
        },
      });

  function goalModal(g) {
    const edit = !!g;
    modal(edit ? 'Edit goal' : 'Add a goal', fld('Name', 'name', edit ? g.name : '', { ph: 'Car insurance, holiday…', max: 40 }) + fld('Target (optional)', 'target', edit && g.target ? g.target : '', { money: true }) +
      fld('Have it by (optional)', 'due', edit && g.due ? g.due : '', { type: 'date', hint: 'With a target and a date, you see how much to set aside each month.' }), {
      submit: edit ? 'Save' : 'Add goal',
      extra: edit ? '<button type="button" class="danger" data-act="goal-del" data-id="' + g.id + '">Delete</button>' : '',
      onSubmit(fd) {
        const name = String(fd.get('name') || '').trim(); if (!name) return 'Give it a name.';
        const target = money(fd, 'target', { optional: true }); if (isErr(target)) return target;
        const due = isDate(fd.get('due')) ? fd.get('due') : '';
        if (edit) { g.name = name; g.target = target || 0; g.due = due || undefined; } else P.goals.push({ id: C.uid(), name, target: target || 0, due: due || undefined });
        save(); render();
