  function goalMoveModal(g, dir) {
    const title = dir === 'in' ? 'Set money aside for ' + g.name : dir === 'out' ? 'Release money from ' + g.name : 'Spend from ' + g.name;
    const saved = C.goalSaved(P, g.id);
    modal(title, '<p class="muted small">' + (dir === 'in' ? 'It stays in your account, but is taken out of what you can spend.' : dir === 'out' ? 'It goes back into what you can spend.' : 'It leaves your account and your goal.') + ' In this goal now: ' + fmt(saved) + '.</p>' + fld('Amount', 'amount', '', { money: true }) + (dir === 'spend' ? fld('What for?', 'note', '', { max: 60 }) : ''), {
      submit: 'Done',
      onSubmit(fd) {
        const amt = money(fd, 'amount'); if (isErr(amt)) return amt;
        if (dir !== 'in' && amt > saved + 0.001) return 'There is only ' + fmt(saved) + ' in this goal.';
        if (dir === 'in') addEntry(C.setAsideEntry(today(), g.id, amt), fmt(amt) + ' set aside');
        else if (dir === 'out') addEntry(C.setAsideEntry(today(), g.id, -amt), fmt(amt) + ' released');
        else addEntry(C.spendEntry(today(), amt, null, String(fd.get('note') || '').trim() || g.name, g.id), fmt(amt) + ' spent from ' + g.name);
      },
    });
  }
  function debtModal(d) {

    const lbill = edit ? P.bills.find((b) => b.debtId === d.id) : null; // the minimum-payment bill this debt created
    modal(edit ? 'Edit debt' : 'Add a debt',
      fld('Name', 'name', edit ? d.name : '', { ph: 'Credit card, loan…', max: 40 }) + fld('What you owe now', 'balance', edit ? C.debtBalance(P, d) : '', { money: true }) +
      fld('Minimum payment (optional)', 'min', edit && d.min ? d.min : '', { money: true }) + fld('Interest rate % (optional)', 'rate', edit && d.rate ? d.rate : '', { money: true }) +
      fld('Due day of the month (optional)', 'day', edit && lbill ? lbill.day : '', { num: true, hint: edit && lbill ? 'The minimum bill follows what you type here.' : 'Adds the minimum to your Bills.' }),
      {
        submit: edit ? 'Save' : 'Add debt',
        extra: edit ? '<button type="button" class="danger" data-act="debt-del" data-id="' + d.id + '">Delete</button>' : '',
        onSubmit(fd) {
          const name = String(fd.get('name') || '').trim(); if (!name) return 'Give it a name.';
          const bal = money(fd, 'balance', { negOk: true }); if (isErr(bal)) return bal;
          const min = money(fd, 'min', { optional: true }); if (isErr(min)) return min;
          const rate = money(fd, 'rate', { optional: true }); if (isErr(rate)) return rate;
          const day = parseInt(fd.get('day'), 10); const dayOk = day >= 1 && day <= 31;
          if (edit) {
            d.balance0 = C.round2(bal + (d.balance0 - C.debtBalance(P, d))); const oldName = d.name; d.name = name; d.min = min || 0; d.rate = rate || 0;
            // the minimum bill follows the debt, so the plan never counts an old amount
            if (lbill && d.min) { lbill.amount = d.min; if (dayOk) lbill.day = day; if (lbill.name === oldName + ' minimum') lbill.name = name + ' minimum'; }
            else if (!lbill && d.min && dayOk) P.bills.push({ id: C.uid(), name: name + ' minimum', amount: d.min, freq: 'monthly', day, debtId: d.id, start: today() });
            save(); render();
            if (lbill && !d.min) {
              const bid = lbill.id;
              setTimeout(() => confirmModal('Remove the minimum bill too?', 'You cleared the minimum payment, but &ldquo;' + esc(lbill.name) + '&rdquo; is still in your Bills (' + esc(fmt(lbill.amount)) + ').', 'Remove it', () => { P.bills = P.bills.filter((b) => b.id !== bid); save(); render(); toast('Bill removed'); }), 0);
            }
            return;
          }
          const nd = { id: C.uid(), name, balance0: bal, min: min || 0, rate: rate || 0 }; P.debts.push(nd);
          if (nd.min && dayOk) P.bills.push({ id: C.uid(), name: name + ' minimum', amount: nd.min, freq: 'monthly', day, debtId: nd.id, start: today() });
          save(); render();
        },
      });

  function debtPayModal(d) {

  /* ---------- setup wizard ---------- */
  function wizard() {
    // the draft outlives the sheet: a stray click, Esc or "Start" again picks up where the person left off
    const BILL_ROWS = ['Rent or mortgage', 'Phone', 'Internet', 'Electric & utilities', 'Subscriptions'];
    if (!ses.wiz || ses.wiz.pid !== P.id) ses.wiz = { pid: P.id, step: 1, title: P.title, currency: P.currency, simple: true, bal: '', inc: { name: 'Paycheck', amount: '', sch: { freq: 'biweekly' } }, rows: BILL_ROWS.map((n) => ({ n, a: '', d: '' })) };
    const W = ses.wiz;
    const keep = (form, fn) => form.addEventListener('input', () => fn(form.elements));
    const step = (n) => {
      W.step = n;
      const nav = '<p class="label">Step ' + n + ' of 4</p>';
      const back = n > 1 ? '<button type="button" data-act="wiz-back">Back</button>' : '';
      ses.wizBack = n > 1 ? () => step(n - 1) : null;
      const skip = '<button type="button" class="ghost" data-act="wiz-skip">Skip setup</button>';
      if (n === 1) {
        modal('Make it yours', nav + fld('Name your plan', 'title', W.title, { max: 40, hint: 'Something that does not feel like someone else’s software.' }) + currencySel(W.currency) +
          '<label class="check"><input type="checkbox" name="simple"' + (W.simple ? ' checked' : '') + '> Keep it simple: fewer screens to start with. You can show everything later in More &rarr; Settings.</label>', {
          submit: 'Next', extra: skip,
          onOpen(form) { keep(form, (el) => { W.title = el.title.value; W.currency = el.currency.value; W.simple = el.simple.checked; }); },
          onSubmit(fd) { W.title = String(fd.get('title') || '').trim() || 'My calm money plan'; W.currency = fd.get('currency'); W.simple = !!fd.get('simple'); step(2); return false; },
        });
      } else if (n === 2) {
        modal('What is in your account right now?', nav + fld('Balance', 'bal', W.bal, { money: true, hint: 'Type it from your banking app. Nothing is connected to your bank.' }), {
          submit: 'Next', extra: back + skip,
          onOpen(form) { keep(form, (el) => { W.bal = el.bal.value; }); },
          onSubmit(fd) { const v = String(fd.get('bal') || '').trim() === '' ? 0 : money(fd, 'bal', { negOk: true }); if (isErr(v)) return v; W.bal = v; step(3); return false; },
        });
      } else if (n === 3) {
        modal('When do you get paid?', nav + fld('Name', 'name', W.inc.name, { max: 40 }) + fld('Amount', 'amount', W.inc.amount, { money: true, hint: 'Leave empty to add this later.' }) + schedFields(W.inc.sch, true), {
          submit: 'Next', extra: back + skip,
          onOpen(form) { bindSched(form); keep(form, (el) => { W.inc.name = el.name.value; W.inc.amount = el.amount.value; }); },
          onSubmit(fd) {
            const raw = String(fd.get('amount') || '').trim(); let amt = '';
            if (raw) { amt = money(fd, 'amount'); if (isErr(amt)) return amt; }
            const sch = readSched(fd, true); if (isErr(sch)) return sch;
            W.inc = { name: String(fd.get('name') || '').trim() || 'Paycheck', amount: amt, sch }; step(4); return false;
          },
        });
      } else {
        const rows = W.rows;
        ses.wizAdd = () => { W.rows.push({ n: '', a: '', d: '' }); step(4); const f = $('#f_n' + (W.rows.length - 1)); if (f) { f.focus(); if (f.scrollIntoView) f.scrollIntoView({ block: 'nearest' }); } };
        const body = nav + '<p class="muted small">Add the ones you have. Leave amounts empty to skip. Other schedules are in Bills.</p>' + W.rows.map((r, i) => '<div class="grid2" style="grid-template-columns:2fr 1fr 1fr;gap:8px;align-items:end"><div><label for="f_n' + i + '">Bill</label><input id="f_n' + i + '" name="n' + i + '" value="' + esc(r.n) + '"></div><div><label for="f_a' + i + '">Amount</label><input id="f_a' + i + '" name="a' + i + '" inputmode="decimal" autocomplete="off" value="' + esc(r.a) + '"></div><div><label for="f_d' + i + '">Day</label><input id="f_d' + i + '" name="d' + i + '" inputmode="numeric" autocomplete="off" placeholder="1-31" value="' + esc(r.d) + '"></div></div>').join('') + '<button type="button" class="tiny" style="margin-top:12px" data-act="wiz-addrow">+ Add another bill</button>';
        modal('Your regular bills', body, {
          submit: 'Finish', extra: back + skip,
          onOpen(form) { const cnt = rows.length; keep(form, (el) => { W.rows = Array.from({ length: cnt }, (_, i) => ({ n: el['n' + i].value, a: el['a' + i].value, d: el['d' + i].value })); }); },
          onSubmit(fd) {
            const bills = [];
            for (let i = 0; i < rows.length; i++) {
              const raw = String(fd.get('a' + i) || '').trim(); if (!raw) continue;
              const a = C.parseMoney(raw); const d = parseInt(fd.get('d' + i), 10); const name = String(fd.get('n' + i) || '').trim() || 'Bill ' + (i + 1);
              if (!(a > 0)) return '“' + name + '” needs an amount like 45 (or clear it).';
              if (!(d >= 1 && d <= 31)) return '“' + name + '” needs a day between 1 and 31.';
              bills.push({ id: C.uid(), name, amount: a, freq: 'monthly', day: d, start: today() });
            }
            finishSetup(W, bills); return undefined;
          },
        });
      }
    };
    step(W.step || 1);
  }
  function finishSetup(W, bills) {
    ses.wiz = null;
    P.title = W.title; P.currency = W.currency; P.created = today(); P.simple = !!W.simple;
    if (W.bal !== '' && Number.isFinite(W.bal)) setBalance(W.bal);
    if (W.inc && W.inc.amount) P.incomes.push(Object.assign({ id: C.uid(), name: W.inc.name, amount: W.inc.amount, start: today() }, W.inc.sch));
    bills.forEach((b) => P.bills.push(b));
    P.setupDone = true; save(); view = 'today'; render(); toast('All set. Your number is on Today.');
  }

  /* ---------- backup ---------- */
  function download(name, text, mime) {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: mime || 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500); return true;
    } catch (e) { return false; }
  }
  function backupText() { return JSON.stringify(S); }
  function doBackup() {
    const ok = download('money-reset-backup-' + today() + '.json', backupText());
    if (ok) { S.lastBackup = today(); S.changes = 0; save(false); render(); toast('Backup downloaded. Keep it somewhere safe.'); }
    else toast('Your browser blocked the download. Use “Copy as text” in More → Backup instead.');
  }
  function restoreFrom(text) {
    let data; try { data = C.validateAppData(JSON.parse(text)); } catch (e) { toast(e && e.message && e.message.startsWith('This file') ? e.message : 'That does not look like a Money Reset backup.'); return; }
    confirmModal('Replace what is on this device?', 'This backup has ' + data.profiles.length + (data.profiles.length === 1 ? ' budget' : ' budgets') + ' (' + data.profiles.map((p) => esc(p.name)).join(', ') + '). It will replace the numbers currently on this device.', 'Restore', () => {
      S = data; P = active(); S.changes = 0; sub = null; view = 'today'; save(false); render(); toast('Restored.');
    });
  }
  function csv() {
    // a leading = + - @ would be run as a formula by spreadsheets, so such text gets a quote mark in front
    const q = (v) => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const d = stmtData();
    const rows = ['Date,Type,Amount,Category,Note'].concat(d.rows.slice().reverse().map((x) => [x.e.date, x.e.type, x.e.delta || 0, q(x.e.cat), q(x.e.type === 'spend' ? x.e.note : entryText(x.e))].join(',')));
    // the BOM makes Excel read the file as UTF-8, so Cyrillic and accents are not garbled
    if (!download('statement-' + d.from + '_' + d.to + '.csv', '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8')) toast('Your browser blocked the download.');
  }

  /* ---------- wiring ---------- */
  // the same planner open in a second tab: pick up its changes instead of overwriting them on the next save
  function syncFromOtherTab() {
    let raw = null; try { raw = localStorage.getItem(KEY); } catch (e) { return; }
    if (!raw) return;
    try { S = C.validateAppData(JSON.parse(raw)); P = active(); ses.syncPending = false; render(); toast('Updated from another tab'); } catch (e) { /* keep what this tab has */ }
  }
  window.addEventListener('storage', (e) => { if (e.key !== KEY) return; if ($('#modalRoot').firstChild) ses.syncPending = true; else syncFromOtherTab(); });
  document.addEventListener('focusin', (e) => { const el = e.target; if (el && el.closest && el.closest('.sheet') && el.scrollIntoView) setTimeout(() => { try { el.scrollIntoView({ block: 'center' }); } catch (_) { /* ignore */ } }, 300); });
  // the visible area shrinks when the keyboard opens: keep the sheet inside what is actually visible
